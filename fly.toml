app = 'naismith-nerds'
primary_region = 'iad'

# Must stay above every section header: a bare key after a [table] belongs to
# that table, so parking this next to [[vm]] silently made it
# http_service.checks.swap_size_mb and enabled no swap at all.
#
# Headroom for the rebuild, which peaks around 364MB resident on a 512MB
# machine. It runs on a background thread, so paging never delays a request.
swap_size_mb = 512

[build]

[processes]
  app = "gunicorn -w 1 -b 0.0.0.0:8080 --timeout 120 --graceful-timeout 30 flask_app.app:app"

# State that must outlive a deploy lives on this volume, not on the machine's
# own filesystem. Running without it cost $0.15/mo and broke two things on
# every single deploy:
#
#   * the rotated OneDrive refresh token was discarded, so the app fell back to
#     the REFRESH_TOKEN secret — a value production had already redeemed, and
#     Microsoft invalidates a refresh token the moment it is redeemed. Result:
#     AADSTS70000 and a manual device-code sign-in after every push.
#   * ratings snapshots written to DuckDB since the last commit were lost. They
#     accumulate one game-day at a time and cannot be recomputed. See db_path().
[mounts]
  source = 'naismith_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  timeout = '10s'
  path = '/health'

# 512MB, not 1GB. A measured rebuild peaks at ~364MB resident and the rest of
# the machine (gunicorn master, hallpass, init) is ~60MB, so 1GB was paying
# roughly $2.50/mo for headroom nothing used. See swap_size_mb at the top.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
